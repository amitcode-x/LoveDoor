<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>New Newsletter Subscriber</title>
  </head>
  <body style="font-family: Arial, sans-serif; background:#f3f4f6; padding:20px;">
    <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;padding:20px;">
      <h2>New Newsletter Subscriber</h2>
      <p><strong>Email:</strong> {{ email }}</p>
      <p><strong>Subscribed at:</strong> {{ subscribed_at }}</p>
      <p><strong>Site:</strong> {{ site_name }}</p>
      <p style="margin-top:12px;font-size:13px;color:#6b7280;">
        This is an automatic notification from your {{ site_name }} website.
      </p>
    </div>
  </body>
</html>
